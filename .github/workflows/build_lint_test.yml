name: Build Lint and Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            nvim_archive: nvim-linux-x86_64.tar.gz
            nvim_dir: nvim-linux-x86_64
            luals_archive: lua-language-server-3.13.6-linux-x64.tar.gz
          - os: macos-latest
            nvim_archive: nvim-macos-arm64.tar.gz
            nvim_dir: nvim-macos-arm64
            luals_archive: lua-language-server-3.13.6-darwin-arm64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: init submodules
      run: git submodule update --init --recursive

    - name: Install Neovim (v0.11.6)
      run: |
        curl -LSs "https://github.com/neovim/neovim/releases/download/v0.11.6/${{ matrix.nvim_archive }}" | tar xzf - -C "$HOME"
        echo "$HOME/${{ matrix.nvim_dir }}/bin" >> $GITHUB_PATH

    - name: Remove macOS quarantine attributes
      if: runner.os == 'macOS'
      run: xattr -cr "$HOME/${{ matrix.nvim_dir }}"

    # Need a fresh install of rust and all its components for rust-analyzer to function properly
    - name: Rust toolchain clean install
      run: |
        if command -v rustup >/dev/null; then
          rustup self uninstall -y || rm -rf "$HOME/.rustup" "$HOME/.cargo"
        fi
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    # Install the pinned toolchain and grab its rust-analyzer before switching
    # to the latest stable for building. We pin rust-analyzer to a specific
    # version to avoid unexpected test breakages with each update.
    - name: Install pinned rust-analyzer (1.87)
      run: |
        rustup toolchain install '1.87' -c rust-analyzer,rust-src
        echo "LSPRESSO_RUST_ANALYZER=$(rustup run 1.87 rustup which rust-analyzer)" >> $GITHUB_ENV

    - name: Set default toolchain to latest stable
      run: rustup default stable

    - name: Add rust components
      run: |
        rustup component add rustfmt clippy

    - name: Build
      run: cargo build --workspace

    - name: Lint
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: fmt
      run: cargo fmt --check

    - name: Run tests
      run: cargo test

    - name: Install luals
      run: |
        mkdir "$HOME/luals"
        curl -LSs "https://github.com/LuaLS/lua-language-server/releases/download/3.13.6/${{ matrix.luals_archive }}" | tar xzf - -C "$HOME/luals"
        echo "$HOME/luals/bin" >> $GITHUB_PATH

    - name: Lua lint
      run: |
        lua-language-server --check lspresso-shot/lua_templates/

    # Uncomment this to ssh into the runner and debug if needed
